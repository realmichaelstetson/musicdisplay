name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to a local Windows JDK; point it at the runner's JDK
      - name: Use runner JDK
        run: sed -i "s#^org.gradle.java.home=.*#org.gradle.java.home=${JAVA_HOME}#" gradle.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: musicdisplay-jars
          path: build/libs/*.jar
